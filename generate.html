<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
<title>Generate QR Kode Alat — Data FSS &amp; APAR</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="data.js"></script>
<style>
  .qr-box { text-align: center; margin-top: 16px; }
  .qr-box > div { background: white; display: inline-block; padding: 14px; border-radius: 12px; }
  .qr-box p { font-weight: 700; margin: 10px 0 0; color:#0f172a; }

  #batchGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 16px;
    margin-top: 18px;
  }
  .qr-item {
    background: white;
    color: #0f172a;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    break-inside: avoid;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .qr-item .qr-canvas { display:flex; justify-content:center; }
  .qr-item .qr-kode { font-weight: 800; font-size: 0.9rem; margin-top: 8px; color: #0284c7; }
  .qr-item .qr-ruangan { font-size: 0.72rem; color: #334155; margin-top: 4px; line-height: 1.3; font-weight: 600; }
</style>
</head>
<body>

<div class="app-container">

  <div style="margin-bottom: 12px;">
    <a class="nav-link" href="index.html" style="display:inline-flex; align-items:center; gap:6px;">
      <span>←</span> Kembali ke Halaman Scan APAR
    </a>
  </div>

  <div class="card">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
      <div style="font-size: 2rem;">🏷️</div>
      <div>
        <h1 style="margin: 0; font-size: 1.3rem;">Generate &amp; Cetak QR Kode Alat</h1>
        <p class="hint" style="margin: 4px 0 0 0;">Dibuat otomatis dari Master Data FSS &amp; APAR. Total <strong id="totalAlat">0</strong> alat berkode.</p>
      </div>
    </div>

    <label for="filterGedung">Filter Berdasarkan Gedung</label>
    <select id="filterGedung">
      <option value="">Semua Gedung</option>
    </select>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px;">
      <button type="button" id="btnGenerateBatch">🔳 Muat Semua QR</button>
      <button type="button" id="btnPrintBatch" class="secondary">🖨️ Cetak / Print QR</button>
    </div>
  </div>

  <div class="card" id="printArea">
    <h2><span>📋</span> Daftar Stiker QR Alat</h2>
    <div id="batchGrid"></div>
  </div>

  <div class="card">
    <h2><span>✏️</span> Buat 1 QR Kode Manual</h2>
    <label for="kode">Ketik Kode Alat</label>
    <div style="display:flex; gap: 8px;">
      <input type="text" id="kode" placeholder="Contoh: 110" />
      <button type="button" id="btnBuat" class="secondary" style="width: auto; min-width: 100px; margin-top:0;">Buat QR</button>
    </div>

    <div class="qr-box hidden" id="qrBox">
      <div id="qrCanvas"></div>
      <p id="qrLabel"></p>
      <button type="button" id="btnPrint" class="secondary small" style="margin-top: 12px; width: auto;">🖨️ Cetak QR Ini</button>
    </div>
  </div>

</div>

<script>
  document.getElementById('totalAlat').textContent = APAR_DATA.filter(r => r.kode).length;

  const filterGedung = document.getElementById('filterGedung');
  const gedungList = [...new Set(APAR_DATA.map(r => r.gedung).filter(Boolean))].sort();
  gedungList.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    filterGedung.appendChild(opt);
  });

  const batchGrid = document.getElementById('batchGrid');

  function generateBatch() {
    const gedung = filterGedung.value;
    let list = APAR_DATA.filter(r => r.kode);
    if (gedung) list = list.filter(r => r.gedung === gedung);

    batchGrid.innerHTML = '';
    list.forEach(r => {
      const item = document.createElement('div');
      item.className = 'qr-item';

      const canvasDiv = document.createElement('div');
      canvasDiv.className = 'qr-canvas';
      item.appendChild(canvasDiv);

      const kodeP = document.createElement('div');
      kodeP.className = 'qr-kode';
      kodeP.textContent = 'KODE: ' + r.kode;
      item.appendChild(kodeP);

      const ruanganP = document.createElement('div');
      ruanganP.className = 'qr-ruangan';
      ruanganP.textContent = `${r.ruangan || ''} — ${r.gedung || ''}${r.lantai ? ' LT.' + r.lantai : ''}`;
      item.appendChild(ruanganP);

      batchGrid.appendChild(item);

      new QRCode(canvasDiv, {
        text: String(r.kode),
        width: 130,
        height: 130,
      });
    });
  }

  document.getElementById('btnGenerateBatch').addEventListener('click', generateBatch);
  filterGedung.addEventListener('change', generateBatch);
  document.getElementById('btnPrintBatch').addEventListener('click', () => {
    if (!batchGrid.children.length) generateBatch();
    window.print();
  });

  generateBatch();

  const kodeInput = document.getElementById('kode');
  const qrBox = document.getElementById('qrBox');
  const qrCanvas = document.getElementById('qrCanvas');
  const qrLabel = document.getElementById('qrLabel');

  document.getElementById('btnBuat').addEventListener('click', () => {
    const kode = kodeInput.value.trim();
    if (!kode) return;

    qrCanvas.innerHTML = '';
    new QRCode(qrCanvas, {
      text: kode,
      width: 240,
      height: 240,
    });

    qrLabel.textContent = 'KODE ALAT: ' + kode;
    qrBox.classList.remove('hidden');
  });

  document.getElementById('btnPrint').addEventListener('click', () => {
    window.print();
  });

  kodeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btnBuat').click();
  });
</script>

</body>
</html>
